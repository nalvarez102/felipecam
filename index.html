<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Felipe's cam</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --accent: #8fb8a8;
    --accent-dark: #5f8f7c;
    --text: #4a4038;
    --muted: #9a8f82;
    --ok: #7fc79b;
    --bad: #e08a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 16px) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .hero {
    text-align: center;
    padding: 10px 0 18px;
  }
  .hero img {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #fff;
    box-shadow: 0 6px 18px rgba(95,143,124,0.25);
  }
  .hero h1 {
    margin: 14px 0 2px;
    font-size: 24px;
    color: var(--accent-dark);
  }
  .hero p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .hero .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .hero .dot.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .hero .dot.offline { background: var(--bad); }

  .video-card {
    background: #111;
    border-radius: 22px;
    overflow: hidden;
    aspect-ratio: 16/9;
    position: relative;
    box-shadow: 0 10px 28px rgba(95,143,124,0.2);
  }
  .video-card iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #111;
    color: #cfcfcf;
    font-size: 14px;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .spinner {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid #333;
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .actions button {
    flex: 1;
    background: var(--card);
    color: var(--accent-dark);
    border: 1px solid #e8ddc9;
    padding: 13px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
  }

  .note {
    margin-top: 22px;
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    text-align: center;
  }

  footer {
    text-align: center;
    color: #c9bda8;
    font-size: 11px;
    margin-top: 24px;
  }
</style>
</head>

<script>
  const STREAM_URL = "http://felipecam.duckdns.org:8889/babycam";

  function reload() {
    const overlay = document.getElementById("overlay");
    const dot = document.getElementById("statusDot");
    const text = document.getElementById("statusText");
    overlay.classList.remove("hidden");
    overlay.innerHTML = '<div class="spinner"></div><div>Cargando la cámara de Felipe...</div>';
    dot.className = "dot";
    text.textContent = "Conectando...";

    const frame = document.getElementById("frame");
    frame.src = "about:blank";
    setTimeout(() => { frame.src = STREAM_URL; }, 100);

    clearTimeout(window._t);
    window._t = setTimeout(() => {
      if (!overlay.classList.contains("hidden")) {
        dot.className = "dot offline";

  }

  function onLoad() {
    document.getElementById("overlay").classList.add("hidden");
    document.getElementById("statusDot").className = "dot online";
    document.getElementById("statusText").textContent = "En vivo";
    clearTimeout(window._t);
  }

    if (el.requestFullscreen) el.requestFullscreen();
